[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrum-kitchen-metrics"
version = "0.1.0"
description = "Flexible metrics aggregation and reporting framework for JIRA / GitLab and more"
authors = [
  {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["jira", "gitlab", "metrics", "reporting", "scrum", "agile"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.5",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "reportlab>=4.0",
  "openpyxl>=3.1",
  "typer[all]>=0.12",
  "rich>=13.7",
  "python-gitlab>=4.4",
  "schedule>=1.2",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pluggy>=1.5",
  "diskcache>=5.6",
  "apscheduler>=3.10"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "weasyprint>=62.0"]

[project.scripts]
skm = "scrum_kitchen_metrics.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

